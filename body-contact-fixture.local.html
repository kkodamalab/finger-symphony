<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  /><title>Body Contact synthetic integration fixture</title>
  <div id="app"></div>
  <script type="module">
    // Explicit synthetic input fixture; never used by the production entry point.
    import { Hands } from "./src/tracking/hands";
    import { BodyPose } from "./src/body/pose";
    import { FaceTracker } from "./src/tracking/face";
    import * as Tone from "tone";
    const state = { pose: [], hands: [], handsInit:0, poseInit:0, handsCalls:0, poseCalls:0, handsClose:0, poseClose:0, faceInit:0, faceCalls:0, faceClose:0, faceY:0.5, cameraRequests:0, constraints:null };
    const canvas = document.createElement("canvas");
    canvas.width = 640;
    canvas.height = 480;
    const ctx = canvas.getContext("2d");
    let running = true;
    function draw() {
      if (!running) return;
      ctx.fillStyle = "#142132";
      ctx.fillRect(0, 0, 640, 480);
      requestAnimationFrame(draw);
    }
    draw();
    navigator.mediaDevices.getUserMedia = async (constraints) => {state.cameraRequests++;state.constraints=constraints;return canvas.captureStream(15)};
    Hands.prototype.init = async function () {
      state.handsInit++;this.landmarker = { close() {state.handsClose++} };
    };
    Hands.prototype.detect = function () {
      state.handsCalls++;return state.hands;
    };
    BodyPose.prototype.init = async function () {
      state.poseInit++;this.model = { close() {state.poseClose++} };
    };
    BodyPose.prototype.detect = function () {
      state.poseCalls++;return state.pose;
    };
    FaceTracker.prototype.start=async function(){state.faceInit++;this.fixtureActive=true};
    FaceTracker.prototype.stop=function(){if(this.fixtureActive)state.faceClose++;this.fixtureActive=false};
    FaceTracker.prototype.detect=function(){if(!this.fixtureActive)return;state.faceCalls++;return state.faceY};
    await import("./src/main");
    const meter = new Tone.Waveform(1024);
    Tone.getDestination().connect(meter);
    window.bodyFixture = { state, meter, Tone };
    const label = document.createElement("p");
    label.textContent =
      "SYNTHETIC POSE / HANDS + CANVAS CAMERA — NOT PHYSICAL DEVICE VALIDATION";
    document.body.prepend(label);
    addEventListener("pagehide", () => {
      running = false;
      meter.dispose();
    });
  </script>
</html>
